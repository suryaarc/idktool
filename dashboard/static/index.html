<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Antigravity Studio Chat</title>
<link rel="manifest" href="/static/manifest.json">
<link rel="icon" href="/static/icon-192.png">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<meta name="theme-color" content="#181818">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Antigravity">

<!-- Markdown Parser & Highlight.js (fonts: matching Antigravity IDE's own Segoe UI, no webfont needed) -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/tokyo-night-dark.min.css">
<script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>

<style>
  /* Palette pulled directly from Antigravity IDE's own chat panel */
  :root {
    --bg: #181818;
    --bg-surface: #1f1f1f;
    --card-bg: #282828;
    --card-hover: #343434;
    --border: rgba(255, 255, 255, 0.05);
    --border-accent: rgba(0, 120, 212, 0.35);
    --text: #cccccc;
    --muted: #757575;
    --muted-secondary: #a1a1a1;
    --accent: #0078d4;
    --accent-hover: #1a86dc;
    --accent-glow: rgba(0, 120, 212, 0.25);
    --user-prompt-bg: #282828;
    --user-prompt-border: rgba(255, 255, 255, 0.08);
    --green: #10b981;
    --red: #ef4444;
    --code-bg: #1a1a1a;
    --safe-area-top: env(safe-area-inset-top, 0px);
    --safe-area-bottom: env(safe-area-inset-bottom, 0px);
  }

  * { box-sizing: border-box; min-width: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%; height: 100dvh;
    background: var(--bg); color: var(--text);
    font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased; overflow: hidden;
  }

  .studio-app {
    display: flex; flex-direction: column; width: 100%; height: 100%; height: 100dvh;
    position: relative; overflow: hidden; background: var(--bg);
  }

  /* Header Bar */
  header.studio-header {
    flex: 0 0 auto;
    padding-top: max(10px, var(--safe-area-top));
    padding-left: 16px; padding-right: 16px; padding-bottom: 10px;
    background: rgba(24, 24, 24, 0.92);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    z-index: 50;
  }

  .brand-group { display: flex; align-items: center; gap: 10px; }
  .brand-icon {
    width: 28px; height: 28px; border-radius: 6px;
    background: var(--accent);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; color: #fff; font-size: 14px;
  }
  .brand-title { font-size: 15px; font-weight: 700; color: var(--text); letter-spacing: -0.01em; }
  
  .status-pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 3px 9px; border-radius: 999px; font-size: 11px; font-weight: 500;
    background: rgba(16, 185, 129, 0.12); color: var(--green); border: 1px solid rgba(16, 185, 129, 0.25);
  }
  .status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); box-shadow: 0 0 6px var(--green); }

  .target-select {
    padding: 5px 9px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--bg-surface); color: var(--text); font-family: inherit;
    font-size: 12px; outline: none; max-width: 170px; text-overflow: ellipsis;
  }

  /* Main Feed Container */
  main.chat-feed-viewport {
    flex: 1 1 auto; overflow-y: auto; overscroll-behavior-y: contain;
    padding: 16px 14px 20px; display: flex; flex-direction: column; gap: 20px;
    scroll-behavior: smooth;
  }
  main.chat-feed-viewport::-webkit-scrollbar { width: 5px; }
  main.chat-feed-viewport::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: 4px; }

  /* Message Block Containers */
  .message-block { display: flex; flex-direction: column; gap: 8px; width: 100%; max-width: 820px; margin: 0 auto; }

  /* User Prompt Box — right-aligned, accent-tinted so it's unmistakably yours,
     never the same width/color as assistant or system content */
  .user-prompt-box {
    background: var(--accent-glow); border: 1px solid var(--border-accent);
    border-radius: 14px; padding: 10px 14px; color: var(--text);
    font-size: 14px; font-weight: 400; line-height: 1.5; word-break: break-word;
    margin-left: auto; margin-right: 0; max-width: 82%; width: fit-content;
  }

  /* Thinking Accordion Card ("Worked for 1m >") */
  .thinking-accordion {
    background: rgba(255, 255, 255, 0.03); border: 1px solid var(--border);
    border-radius: 10px; overflow: hidden; margin-top: 4px; transition: border-color 0.2s;
  }
  .thinking-accordion summary {
    padding: 8px 12px; font-size: 12px; color: var(--muted); font-weight: 500;
    cursor: pointer; display: flex; align-items: center; justify-content: space-between;
    list-style: none; user-select: none;
  }
  .thinking-accordion summary::-webkit-details-marker { display: none; }
  .thinking-accordion summary:hover { color: var(--text); background: rgba(255, 255, 255, 0.02); }
  .thinking-content {
    padding: 10px 12px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--border);
    background: rgba(0, 0, 0, 0.2); font-family: Consolas, 'Courier New', monospace; line-height: 1.5;
  }

  /* Assistant Response Body */
  .assistant-body {
    padding: 4px 0; color: var(--text); font-size: 14px; line-height: 1.6;
    word-break: break-word;
  }

  /* Formatted Markdown in Assistant Body */
  .markdown-content p { margin: 0 0 10px; }
  .markdown-content p:last-child { margin-bottom: 0; }
  .markdown-content h1, .markdown-content h2, .markdown-content h3 { margin: 14px 0 8px; font-weight: 700; color: var(--text); }
  .markdown-content h1 { font-size: 17px; }
  .markdown-content h2 { font-size: 15px; border-bottom: 1px solid var(--border); padding-bottom: 4px; }
  .markdown-content h3 { font-size: 14px; }
  .markdown-content ul, .markdown-content ol { margin: 6px 0 10px 18px; padding: 0; }
  .markdown-content li { margin-bottom: 4px; }
  .markdown-content code {
    font-family: Consolas, 'Courier New', monospace; font-size: 12.5px;
    background: var(--code-bg); color: #4daafc; padding: 2px 6px;
    border-radius: 4px; border: 1px solid rgba(255,255,255,0.08);
  }
  .markdown-content pre {
    background: var(--code-bg); border: 1px solid var(--border);
    border-radius: 10px; padding: 12px; overflow-x: auto; margin: 10px 0; position: relative;
  }
  .markdown-content pre code { background: none; border: none; padding: 0; color: #e2e8f0; font-size: 13px; display: block; line-height: 1.5; }
  
  .copy-code-btn {
    position: absolute; top: 6px; right: 6px; background: rgba(255, 255, 255, 0.08);
    border: 1px solid var(--border); color: var(--muted); border-radius: 6px;
    padding: 3px 8px; font-size: 11px; cursor: pointer; transition: all 0.15s;
  }
  .copy-code-btn:hover { background: var(--accent); color: #fff; }

  /* File Change Badge Card ("1 file changed +377 -507 > Review") */
  .diff-summary-card {
    background: var(--card-bg); border: 1px solid var(--border);
    border-radius: 10px; padding: 8px 12px; display: flex; align-items: center;
    justify-content: space-between; gap: 10px; margin: 10px 0 6px; font-size: 12.5px;
    transition: border-color 0.2s;
  }
  .diff-summary-card:hover { border-color: var(--border-accent); }
  .diff-stats-info { display: flex; align-items: center; gap: 8px; color: var(--muted); font-weight: 500; }
  .diff-add-text { color: var(--green); font-weight: 600; }
  .diff-del-text { color: var(--red); font-weight: 600; }

  .review-btn {
    background: rgba(255, 255, 255, 0.06); border: 1px solid var(--border);
    color: var(--text); border-radius: 8px; padding: 4px 10px; font-size: 12px;
    font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 4px;
    transition: all 0.15s;
  }
  .review-btn:hover { background: var(--accent); border-color: var(--accent); color: #fff; }

  /* Tool Call & Action Approval Card */
  .tool-call-card {
    background: #1a1c29; border: 1px solid rgba(139, 92, 246, 0.35);
    border-radius: 8px; padding: 5px 9px; margin: 3px 0;
    display: flex; flex-direction: column; gap: 3px; font-size: 11.5px;
  }
  .tool-call-card.compact {
    flex-direction: row; align-items: center; gap: 6px;
    border-color: var(--border); background: rgba(255, 255, 255, 0.02);
  }
  .tool-call-header {
    display: flex; align-items: center; justify-content: space-between;
    gap: 6px; font-weight: 500; color: var(--muted); font-size: 11.5px; min-width: 0;
  }
  .tool-call-header strong { font-weight: 600; color: var(--accent); }
  .tool-call-card.compact .tool-call-header {
    color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .tool-call-detail {
    font-family: Consolas, 'Courier New', monospace; font-size: 10.5px; color: var(--muted);
    background: rgba(0, 0, 0, 0.3); padding: 2px 7px; border-radius: 6px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    border: 1px solid rgba(255, 255, 255, 0.05);
  }
  .tool-call-actions {
    display: flex; align-items: center; gap: 8px; margin-top: 4px; justify-content: flex-end;
  }
  .btn-approve {
    background: linear-gradient(135deg, var(--green), #059669); border: none;
    color: #fff; border-radius: 8px; padding: 5px 12px; font-size: 12px;
    font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 4px;
    box-shadow: 0 2px 8px rgba(16, 185, 129, 0.3); transition: transform 0.15s;
  }
  .btn-approve:active { transform: scale(0.95); }
  .btn-reject {
    background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.3);
    color: var(--red); border-radius: 8px; padding: 5px 12px; font-size: 12px;
    font-weight: 600; cursor: pointer; transition: all 0.15s;
  }
  .btn-reject:active { background: rgba(239, 68, 68, 0.3); }

  /* Message Utility Action Bar (Copy / Like / Dislike) */
  .msg-action-bar {
    display: flex; align-items: center; justify-content: flex-end; gap: 12px; margin-top: 4px; color: var(--muted); font-size: 13px;
  }
  .action-icon-btn {
    background: none; border: none; color: var(--muted); cursor: pointer;
    padding: 3px 5px; border-radius: 6px; display: inline-flex; align-items: center; justify-content: center;
    transition: color 0.15s;
  }
  .action-icon-btn:hover { color: var(--text); }

  /* Bottom Toolbar & Prompt Input Box */
  footer.prompt-footer {
    flex: 0 0 auto;
    padding: 12px 14px max(14px, var(--safe-area-bottom));
    background: rgba(18, 19, 25, 0.95);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border-top: 1px solid var(--border); z-index: 40;
    display: flex; flex-direction: column; gap: 10px; max-width: 850px; margin: 0 auto; width: 100%;
  }

  /* Review Bar at bottom ("<- 📄 1 File With Changes | Review Changes") */
  .bottom-status-bar {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 12px; color: var(--muted); padding-bottom: 2px;
  }
  .files-counter { display: flex; align-items: center; gap: 6px; cursor: pointer; }
  .files-counter:hover { color: var(--text); }

  /* Input Container */
  .prompt-input-card {
    background: var(--user-prompt-bg); border: 1px solid var(--border-accent);
    border-radius: 16px; padding: 8px 12px; display: flex; flex-direction: column; gap: 8px;
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4); transition: border-color 0.2s, box-shadow 0.2s;
  }
  .prompt-input-card:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }

  .prompt-textarea {
    width: 100%; background: transparent; border: none; color: var(--text);
    font-family: inherit; font-size: 14px; padding: 4px 0; outline: none;
    resize: none; max-height: 120px; min-height: 38px; line-height: 1.45;
  }

  .prompt-toolbar {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
  }

  .mode-pill {
    padding: 3px 9px; border-radius: 6px; background: var(--accent-glow);
    color: var(--accent); border: 1px solid var(--border-accent); font-size: 11.5px;
    font-weight: 600; cursor: pointer; user-select: none;
  }

  .send-prompt-btn {
    background: var(--accent);
    border: none; color: #fff; border-radius: 6px; padding: 6px 14px;
    font-weight: 600; font-size: 13px; cursor: pointer; display: inline-flex;
    align-items: center; gap: 5px;
    transition: transform 0.15s;
  }
  .send-prompt-btn:hover { background: var(--accent-hover); }
  .send-prompt-btn:active { transform: scale(0.95); }

  .stop-prompt-btn {
    background: var(--red); border: none; border-radius: 10px; padding: 6px 14px;
    font-weight: 600; font-size: 13px; cursor: pointer; display: inline-flex;
    align-items: center; gap: 6px; color: #fff; transition: transform 0.15s;
  }
  .stop-prompt-btn:active { transform: scale(0.95); }
  .stop-prompt-btn .stop-square { width: 9px; height: 9px; border-radius: 1px; background: #fff; }

  /* Interactive Diff Drawer Modal */
  .diff-drawer-overlay {
    display: none; position: fixed; inset: 0; background: rgba(10, 11, 16, 0.95);
    backdrop-filter: blur(14px); z-index: 100; flex-direction: column; overflow: hidden;
    animation: drawerUp 0.2s ease-out;
  }
  .diff-drawer-overlay.active { display: flex; }
  @keyframes drawerUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

  .drawer-header {
    padding: 14px 18px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    background: var(--bg-surface);
  }
  .drawer-body { flex: 1 1 auto; overflow-y: auto; padding: 16px; }

  .diff-file-block { margin-bottom: 14px; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; background: var(--card-bg); }
  .diff-file-header { padding: 9px 12px; background: rgba(255, 255, 255, 0.03); font-family: Consolas, 'Courier New', monospace; font-size: 12px; border-bottom: 1px solid var(--border); color: var(--accent); font-weight: 600; }
  .diff-line { font-family: Consolas, 'Courier New', monospace; font-size: 11.5px; white-space: pre-wrap; padding: 2px 10px; line-height: 1.45; }
  .diff-add { background: rgba(16, 185, 129, 0.12); color: var(--green); }
  .diff-del { background: rgba(239, 68, 68, 0.12); color: var(--red); }
  .diff-hunk { color: var(--muted); background: rgba(255, 255, 255, 0.03); }

  .empty { text-align: center; color: var(--muted); padding: 30px; font-size: 13.5px; border: 1px dashed var(--border); border-radius: 12px; }
</style>
</head>
<body>

<div class="studio-app">
  <!-- HEADER -->
  <header class="studio-header">
    <div class="brand-group">
      <div class="brand-icon">A</div>
      <div class="brand-title">Antigravity</div>
      <div id="connection-status-pill" class="status-pill"><span class="status-dot"></span> Live WS</div>
    </div>

    <!-- Header Right Controls -->
    <div style="display:flex; align-items:center; gap:6px; flex-wrap:wrap;">
      <button class="review-btn" onclick="startNewChat()" title="Start a new Antigravity conversation">
        + New Chat
      </button>
      <select id="antigravity-session" class="target-select" onchange="selectSession(this.value)">
        <option value="">📜 Session: Current Active</option>
      </select>
      <select id="antigravity-target" class="target-select">
        <option value="">Auto Target Window</option>
      </select>
    </div>
  </header>

  <!-- CHAT FEED VIEWPORT -->
  <main id="chat-feed-viewport" class="chat-feed-viewport">
    <div class="empty">Connecting real-time WebSocket stream…</div>
  </main>

  <!-- FOOTER PROMPT INPUT -->
  <footer class="prompt-footer">
    <!-- Bottom Workspace Diff Status Bar -->
    <div class="bottom-status-bar">
      <div class="files-counter" onclick="openWorkspaceDiffDrawer()">
        ← 📄 <span id="workspace-files-summary">0 Files With Changes</span>
      </div>
      <div style="display:flex; gap:6px;">
        <button class="review-btn" onclick="openTelemetryDrawer()">
          📈 Activity
        </button>
        <button class="review-btn" onclick="openWorkspaceDiffDrawer()">
          Review Changes
        </button>
      </div>
    </div>

    <!-- Prompt Box -->
    <div class="prompt-input-card">
      <textarea id="antigravity-prompt" class="prompt-textarea" rows="1" placeholder="Ask Antigravity AI anything (Ctrl+Enter to send)..."></textarea>
      
      <div class="prompt-toolbar">
        <div id="mode-pill" class="mode-pill" onclick="cycleMode()">Agent</div>
        <button id="prompt-action-btn" class="send-prompt-btn" onclick="sendAntigravityPrompt()">
          Send 🚀
        </button>
      </div>
    </div>
    <div id="antigravity-status" style="font-size:11px; color:var(--muted); text-align:center;"></div>
  </footer>
</div>

<!-- WORKSPACE DIFF OVERLAY DRAWER -->
<div id="diff-drawer" class="diff-drawer-overlay">
  <div class="drawer-header">
    <h3 style="margin:0; font-size:15px; font-weight:700; color:var(--text);">Workspace Diff Review</h3>
    <button class="review-btn" onclick="closeWorkspaceDiffDrawer()">Close ✕</button>
  </div>
  <div id="diff-drawer-body" class="drawer-body">
    <div class="empty">Loading workspace diffs…</div>
  </div>
</div>

<!-- FILE-CHANGE TELEMETRY DRAWER -->
<div id="telemetry-drawer" class="diff-drawer-overlay">
  <div class="drawer-header">
    <h3 style="margin:0; font-size:15px; font-weight:700; color:var(--text);">File Change Activity</h3>
    <button class="review-btn" onclick="closeTelemetryDrawer()">Close ✕</button>
  </div>
  <div class="drawer-body">
    <canvas id="telemetry-canvas" style="width:100%; height:220px; display:block;"></canvas>
    <div id="telemetry-empty" class="empty" style="display:none;">No file-change activity recorded yet — send a prompt that edits files.</div>
  </div>
</div>

<script>
let currentMode = "agent";
const MODES = ["agent", "edit", "ask"];
let lastRenderedHash = "";
let isInitialChatLoad = true;
let currentDiffData = null;
let ws = null;
let currentConversationSessionId = null;
let suppressSessionId = null; // set right after "New Chat" — a fresh chat has no file yet,
                               // so polling would otherwise keep re-showing the old session

function cycleMode() {
  const nextIdx = (MODES.indexOf(currentMode) + 1) % MODES.length;
  currentMode = MODES[nextIdx];
  const badge = document.getElementById("mode-pill");
  badge.textContent = currentMode.charAt(0).toUpperCase() + currentMode.slice(1);
}

async function getJSON(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}

function el(tag, opts = {}, children = []) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(opts)) {
    if (k === "class") node.className = v;
    else if (k === "text") node.textContent = v;
    else if (k === "html") node.innerHTML = v;
    else if (k === "onclick") node.onclick = v;
    else node.setAttribute(k, v);
  }
  for (const c of children) {
    if (typeof c === "string") node.appendChild(document.createTextNode(c));
    else if (c) node.appendChild(c);
  }
  return node;
}

function formatMarkdown(text) {
  if (!text) return "";
  try {
    if (window.marked && typeof marked.parse === 'function') {
      return marked.parse(text);
    }
  } catch (e) {}
  
  let html = text
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/```([\s\S]*?)```/g, '<pre><code>$1</code></pre>')
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/\n/g, '<br>');
  return html;
}

function attachCodeCopyButtons(container) {
  container.querySelectorAll('pre').forEach(pre => {
    if (pre.querySelector('.copy-code-btn')) return;
    const btn = document.createElement('button');
    btn.className = 'copy-code-btn';
    btn.textContent = 'Copy';
    btn.onclick = () => {
      const code = pre.querySelector('code')?.innerText || pre.innerText;
      navigator.clipboard.writeText(code);
      btn.textContent = 'Copied!';
      setTimeout(() => btn.textContent = 'Copy', 2000);
    };
    pre.appendChild(btn);
  });
}

// Auto-expanding textarea
const promptInput = document.getElementById("antigravity-prompt");
promptInput.addEventListener("input", function() {
  this.style.height = "auto";
  this.style.height = Math.min(this.scrollHeight, 120) + "px";
});
promptInput.addEventListener("keydown", (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === "Enter") {
    e.preventDefault();
    sendAntigravityPrompt();
  }
});

function scrollToBottom(force = false) {
  const container = document.getElementById("chat-feed-viewport");
  if (!container) return;
  container.scrollTo({
    top: container.scrollHeight,
    behavior: force || isInitialChatLoad ? "auto" : "smooth"
  });
}

// Which entry of m.texts is the actual message body.
//
// The backend used to truncate texts to 3, so "the last one" happened to be the
// real content. With history uncapped a message can carry many entries and the
// last is usually trailing context — a ripgrep command line, a file path — not the
// answer; on one session 62 of 71 assistant messages changed for the worse when
// the cap was lifted. The meaningful text stays at the front, so pin the body to
// index 2 when it exists and let everything else fall into the accordion.
function mainTextIndex(texts) {
  if (!texts || !texts.length) return 0;
  return Math.min(2, texts.length - 1);
}

function renderMessageBlock(m, isLast = false) {
  const block = el("div", { class: "message-block" });
  const isUser = m.role === "user";
  const isSystem = m.role === "system";

  if (isUser) {
    const userPromptText = (m.texts && m.texts[0]) || "";
    block.appendChild(el("div", { class: "user-prompt-box", text: userPromptText }));
  } else if (isSystem) {
    // Session/task metadata, not a real assistant turn — a small muted note, not a full bubble
    const sysTexts = m.texts || [];
    const noteText = sysTexts[mainTextIndex(sysTexts)] || "";
    if (noteText) {
      block.appendChild(el("div", {
        style: "color:var(--muted); font-size:11px; text-align:center; padding:2px 0;",
        text: noteText
      }));
    }
  } else {
    const texts = m.texts || [];
    const mainIdx = mainTextIndex(texts);
    const extras = texts.filter((_, i) => i !== mainIdx);
    const thinkingText = extras.join("\n");
    if (thinkingText) {
      const details = el("details", { class: "thinking-accordion" }, [
        el("summary", { html: `<span>${extras.length} more part${extras.length === 1 ? "" : "s"}</span><span>▼</span>` }),
        el("div", { class: "thinking-content", text: thinkingText })
      ]);
      block.appendChild(details);
    }

    const mainResponse = texts[mainIdx] || "";
    const bodyDiv = el("div", { class: "assistant-body" }, [
      el("div", { class: "markdown-content", html: formatMarkdown(mainResponse) })
    ]);
    attachCodeCopyButtons(bodyDiv);
    if (window.hljs) {
      bodyDiv.querySelectorAll('pre code').forEach(b => hljs.highlightElement(b));
    }
    block.appendChild(bodyDiv);

    // Tool Call & Action Approval Cards
    if (m.tool_calls && m.tool_calls.length) {
      for (const t of m.tool_calls) {
        // Only an actual shell command (CommandLine) goes through Antigravity's real
        // "Allow running this command?" gate — file reads/dir listings/etc. auto-run and
        // were never pending, so they shouldn't get Approve/Reject or "Already resolved".
        const needsApproval = !!t.CommandLine;
        // Whether it's STILL waiting is the step's own status, reported by the backend —
        // not its position in the list. An already-approved command that ran and printed
        // its output is routinely still the newest message, and must not offer the buttons.
        const isPending = m.pending_approval === true;
        const title = t.toolAction || t.toolSummary || (needsApproval ? "Run Command Proposal" : "File Action");
        const detail = t.CommandLine || t.TargetFile || t.AbsolutePath || t.Prompt || "";
        const desc = needsApproval ? (t.Description || "") : "";

        const card = el("div", { class: needsApproval ? "tool-call-card" : "tool-call-card compact" }, [
          el("div", { class: "tool-call-header" }, [
            el("span", { html: `⚡ <strong>${title}</strong>` }),
            needsApproval ? el("span", { class: "badge-role assistant", text: "Action Approval" }) : null
          ]),
          desc ? el("div", { style: "color:var(--muted); font-size:11px;", text: desc }) : null,
          detail ? el("div", { class: "tool-call-detail", text: detail }) : null,
          needsApproval
            ? (isPending
                ? el("div", { class: "tool-call-actions" }, [
                    el("button", { class: "btn-approve", onclick: () => sendQuickPermissionResponse("approve"), html: "✓ Approve & Run" }),
                    el("button", { class: "btn-reject", onclick: () => sendQuickPermissionResponse("reject"), html: "✕ Reject" })
                  ])
                : el("div", { style: "color:var(--muted); font-size:11px; font-style:italic;", text: "Already resolved" }))
            : null
        ]);
        block.appendChild(card);
      }
    }

    // Diff summary card matching Antigravity IDE UI (1 file changed +377 -507 > [Review])
    if (isLast && currentDiffData && currentDiffData.file_count > 0) {
      const fileText = currentDiffData.file_count === 1 ? "1 file changed" : `${currentDiffData.file_count} files changed`;
      const addText = `+${currentDiffData.additions || 0}`;
      const delText = `-${currentDiffData.deletions || 0}`;
      
      const diffCard = el("div", { class: "diff-summary-card" }, [
        el("div", { class: "diff-stats-info" }, [
          el("span", { text: fileText }),
          el("span", { class: "diff-add-text", text: addText }),
          el("span", { class: "diff-del-text", text: delText }),
          el("span", { text: "›" })
        ]),
        el("button", { class: "review-btn", onclick: openWorkspaceDiffDrawer, html: "📄 Review" })
      ]);
      block.appendChild(diffCard);
    }

  }

  return block;
}

function updateConversationData(data) {
  const container = document.getElementById("chat-feed-viewport");

  if (suppressSessionId !== null) {
    if (data && data.session_id === suppressSessionId) {
      return; // still the old session's file — new chat has no file of its own yet, keep showing the cleared state
    }
    suppressSessionId = null; // a genuinely new session's file showed up — resume normal rendering
  }
  currentConversationSessionId = data ? data.session_id : null;

  if (!data || !data.messages || !data.messages.length) {
    if (lastRenderedHash !== "empty") {
      container.innerHTML = '<div class="empty">No active Antigravity session found.</div>';
      lastRenderedHash = "empty";
    }
    return;
  }

  // pending_approval is part of the hash: answering a prompt flips only that flag, leaving
  // idx/role/text length identical, so without it the resolved card never re-renders and
  // stale Approve/Reject buttons stay clickable on screen.
  const currentHash = data.messages.map(m => `${m.idx}:${m.role}:${m.pending_approval ? 1 : 0}:${(m.texts || []).join('').length}`).join('|');
  if (currentHash === lastRenderedHash) {
    return; // Zero flicker if content hasn't changed
  }

  const existingBlocks = container.querySelectorAll(".message-block");
  const existingCount = existingBlocks.length;

  if (lastRenderedHash && lastRenderedHash !== "empty" && existingCount > 0 && data.messages.length > existingCount) {
    const newMessages = data.messages.slice(existingCount);
    for (let i = 0; i < newMessages.length; i++) {
      const isLast = i === newMessages.length - 1;
      container.appendChild(renderMessageBlock(newMessages[i], isLast));
    }
  } else {
    container.innerHTML = "";
    for (let i = 0; i < data.messages.length; i++) {
      const isLast = i === data.messages.length - 1;
      container.appendChild(renderMessageBlock(data.messages[i], isLast));
    }
  }

  lastRenderedHash = currentHash;
  scrollToBottom();
  if (isInitialChatLoad) isInitialChatLoad = false;
}

function updateAgentDiffData(data) {
  currentDiffData = data;
  const summaryEl = document.getElementById("workspace-files-summary");
  if (data && data.file_count !== undefined) {
    summaryEl.textContent = `${data.file_count} File${data.file_count === 1 ? '' : 's'} With Changes`;
  }
}

function updateTargetsData(targets) {
  const sel = document.getElementById("antigravity-target");
  if (!sel) return;
  const currentVal = sel.value;
  sel.innerHTML = '<option value="">Auto Target Window</option>';
  for (const t of (targets || [])) {
    const option = el("option", { text: t.title.replace(" - Antigravity IDE", ""), value: t.id });
    if (t.id === currentVal) option.selected = true;
    sel.appendChild(option);
  }
}

async function sendAntigravityPrompt() {
  const promptEl = document.getElementById("antigravity-prompt");
  const targetEl = document.getElementById("antigravity-target");
  const statusEl = document.getElementById("antigravity-status");
  const prompt = promptEl.value.trim();
  if (!prompt) return;

  const targetId = targetEl ? targetEl.value : null;

  statusEl.innerHTML = '<span style="color:var(--accent);">Sending prompt to Antigravity AI…</span>';
  try {
    const res = await fetch("/api/antigravity/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ prompt, mode: currentMode, target_id: targetId || null }),
    });
    if (!res.ok) throw new Error(await res.text());
    statusEl.innerHTML = `<span style="color:var(--green);">✓ Sent! Streaming live...</span>`;
    promptEl.value = "";
    promptEl.style.height = "38px";
    setTimeout(() => { statusEl.textContent = ""; }, 1500);
  } catch (e) {
    statusEl.innerHTML = `<span style="color:var(--red);">Failed: ${e.message}</span>`;
  }
}

async function startNewChat() {
  const targetEl = document.getElementById("antigravity-target");
  const statusEl = document.getElementById("antigravity-status");
  const targetId = targetEl ? targetEl.value : null;

  statusEl.innerHTML = '<span style="color:var(--accent);">Starting new chat…</span>';
  try {
    const res = await fetch("/api/antigravity/new-chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ target_id: targetId || null }),
    });
    if (!res.ok) throw new Error(await res.text());
    statusEl.innerHTML = `<span style="color:var(--green);">✓ New chat started</span>`;

    suppressSessionId = currentConversationSessionId; // ignore the old file until a new one appears
    const container = document.getElementById("chat-feed-viewport");
    container.innerHTML = '<div class="empty">New conversation started — say something!</div>';
    lastRenderedHash = "empty";

    setTimeout(() => { statusEl.textContent = ""; }, 1500);
  } catch (e) {
    statusEl.innerHTML = `<span style="color:var(--red);">Failed: ${e.message}</span>`;
  }
}

async function stopAntigravityPrompt() {
  const targetEl = document.getElementById("antigravity-target");
  const statusEl = document.getElementById("antigravity-status");
  const targetId = targetEl ? targetEl.value : null;

  statusEl.innerHTML = '<span style="color:var(--accent);">Stopping…</span>';
  try {
    const res = await fetch("/api/antigravity/stop", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ target_id: targetId || null }),
    });
    if (!res.ok) throw new Error(await res.text());
    statusEl.innerHTML = `<span style="color:var(--green);">✓ Stopped</span>`;
    setTimeout(() => { statusEl.textContent = ""; }, 1500);
  } catch (e) {
    statusEl.innerHTML = `<span style="color:var(--red);">Failed: ${e.message}</span>`;
  }
}

function updateBusyState(busy) {
  const btn = document.getElementById("prompt-action-btn");
  if (!btn) return;
  if (busy) {
    btn.className = "stop-prompt-btn";
    btn.onclick = stopAntigravityPrompt;
    btn.innerHTML = '<span class="stop-square"></span> Stop';
  } else {
    btn.className = "send-prompt-btn";
    btn.onclick = sendAntigravityPrompt;
    btn.innerHTML = "Send 🚀";
  }
}

async function sendQuickPermissionResponse(decision) {
  const statusEl = document.getElementById("antigravity-status");
  const targetEl = document.getElementById("antigravity-target");
  const targetId = targetEl ? targetEl.value : null;

  statusEl.innerHTML = `<span style="color:var(--accent);">Triggering ${decision === "approve" ? "Approve & Run" : "Reject"}…</span>`;
  try {
    const res = await fetch("/api/antigravity/permission", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ decision, target_id: targetId || null }),
    });
    if (!res.ok) throw new Error(await res.text());
    statusEl.innerHTML = `<span style="color:var(--green);">✓ ${decision === "approve" ? "Approved" : "Rejected"}!</span>`;
    setTimeout(() => { statusEl.textContent = ""; }, 1500);
  } catch (e) {
    statusEl.innerHTML = `<span style="color:var(--red);">Failed: ${e.message}</span>`;
  }
}

function diffLineClass(line) {
  if (line.startsWith("+++") || line.startsWith("---")) return "";
  if (line.startsWith("+")) return "diff-add";
  if (line.startsWith("-")) return "diff-del";
  if (line.startsWith("@@")) return "diff-hunk";
  return "";
}

function openWorkspaceDiffDrawer() {
  const drawer = document.getElementById("diff-drawer");
  const body = document.getElementById("diff-drawer-body");
  drawer.classList.add("active");
  body.innerHTML = '<div class="empty">Loading workspace diffs…</div>';
  
  if (currentDiffData && currentDiffData.files && currentDiffData.files.length) {
    body.innerHTML = "";
    for (const f of currentDiffData.files) {
      const fileDiv = el("div", { class: "diff-file-block" });
      fileDiv.appendChild(el("div", { class: "diff-file-header", text: f.path }));
      const lines = (f.diff || "").split("\n");
      for (const line of lines) {
        fileDiv.appendChild(el("div", { class: `diff-line ${diffLineClass(line)}`, text: line || " " }));
      }
      body.appendChild(fileDiv);
    }
  } else if (currentDiffData && currentDiffData.status && currentDiffData.status.length) {
    body.innerHTML = "";
    for (const st of currentDiffData.status) {
      const fileDiv = el("div", { class: "diff-file-block" });
      fileDiv.appendChild(el("div", { class: "diff-file-header", text: st }));
      body.appendChild(fileDiv);
    }
  } else {
    body.innerHTML = '<div class="empty">No workspace file changes to display.</div>';
  }
}

function closeWorkspaceDiffDrawer() {
  document.getElementById("diff-drawer").classList.remove("active");
}

let telemetryPoints = [];

function drawTelemetryChart() {
  const canvas = document.getElementById("telemetry-canvas");
  const emptyEl = document.getElementById("telemetry-empty");
  if (!canvas) return;

  if (!telemetryPoints.length) {
    canvas.style.display = "none";
    emptyEl.style.display = "block";
    return;
  }
  canvas.style.display = "block";
  emptyEl.style.display = "none";

  const dpr = window.devicePixelRatio || 1;
  const w = canvas.clientWidth || canvas.parentElement.clientWidth;
  const h = 220;
  canvas.width = w * dpr;
  canvas.height = h * dpr;
  const ctx = canvas.getContext("2d");
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, w, h);

  const padding = { top: 16, right: 12, bottom: 26, left: 34 };
  const plotW = w - padding.left - padding.right;
  const plotH = h - padding.top - padding.bottom;
  const points = telemetryPoints.slice(-50);
  const maxFiles = Math.max(1, ...points.map(p => p.file_count));
  const barGap = 4;
  const barW = Math.max(2, plotW / points.length - barGap);

  ctx.strokeStyle = "rgba(255,255,255,0.08)";
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(padding.left, padding.top);
  ctx.lineTo(padding.left, padding.top + plotH);
  ctx.lineTo(padding.left + plotW, padding.top + plotH);
  ctx.stroke();

  ctx.fillStyle = "#8b95a5";
  ctx.font = "11px Inter, sans-serif";
  ctx.fillText(String(maxFiles), 4, padding.top + 4);
  ctx.fillText("0", 4, padding.top + plotH);

  points.forEach((p, i) => {
    const x = padding.left + i * (barW + barGap);
    const barH = (p.file_count / maxFiles) * plotH;
    const y = padding.top + plotH - barH;
    ctx.fillStyle = "#0078d4";
    ctx.fillRect(x, y, barW, Math.max(1, barH));
  });

  const last = points[points.length - 1];
  ctx.fillStyle = "#f1f5f9";
  ctx.font = "12px Inter, sans-serif";
  ctx.fillText(
    `${last.file_count} file${last.file_count === 1 ? "" : "s"} · +${last.additions} -${last.deletions}`,
    padding.left,
    h - 6
  );
}

async function openTelemetryDrawer() {
  document.getElementById("telemetry-drawer").classList.add("active");
  try {
    telemetryPoints = await getJSON("/api/antigravity/telemetry?limit=100");
  } catch (e) {
    telemetryPoints = [];
  }
  drawTelemetryChart();
}

function closeTelemetryDrawer() {
  document.getElementById("telemetry-drawer").classList.remove("active");
}

let selectedSessionId = "";

async function loadConversationsList() {
  const sel = document.getElementById("antigravity-session");
  if (!sel) return;
  try {
    const list = await getJSON("/api/antigravity/conversations?limit=30");
    const currentVal = sel.value;
    sel.innerHTML = '<option value="">📜 Session: Live Active</option>';
    for (const item of list) {
      const option = el("option", {
        text: `${item.formatted_time} - ${item.title}`,
        value: item.session_id
      });
      if (item.session_id === currentVal) option.selected = true;
      sel.appendChild(option);
    }
  } catch (e) {}
}

async function selectSession(sessionId) {
  selectedSessionId = sessionId || "";
  suppressSessionId = null; // explicit navigation always wins over the new-chat suppression
  lastRenderedHash = "";
  if (!sessionId) {
    const statusPill = document.getElementById("connection-status-pill");
    statusPill.innerHTML = '<span class="status-dot"></span> Live WS Stream';
    statusPill.style.color = 'var(--green)';
    try {
      const data = await getJSON("/api/antigravity/conversation");
      updateConversationData(data);
    } catch (e) {}
  } else {
    const statusPill = document.getElementById("connection-status-pill");
    statusPill.innerHTML = '<span class="status-dot" style="background:var(--accent);"></span> History Session';
    statusPill.style.color = 'var(--accent)';
    try {
      const data = await getJSON(`/api/antigravity/conversation?session_id=${encodeURIComponent(sessionId)}`);
      updateConversationData(data);
    } catch (e) {
      document.getElementById("chat-feed-viewport").innerHTML = '<div class="empty">Failed to load selected session history</div>';
    }
  }
}

// REAL-TIME WEBSOCKET LIVE CONNECTIVITY
function connectWebSocket() {
  const statusPill = document.getElementById("connection-status-pill");
  const protocol = location.protocol === "https:" ? "wss:" : "ws:";
  const wsUrl = `${protocol}//${location.host}/ws/live`;
  
  ws = new WebSocket(wsUrl);

  ws.onopen = () => {
    if (!selectedSessionId) {
      statusPill.innerHTML = '<span class="status-dot"></span> Live WS Stream';
      statusPill.style.color = 'var(--green)';
    }
  };

  ws.onmessage = (event) => {
    try {
      const msg = JSON.parse(event.data);
      if (msg.type === "conversation") {
        if (!selectedSessionId) updateConversationData(msg.data);
      } else if (msg.type === "agent_diff") updateAgentDiffData(msg.data);
      else if (msg.type === "targets") updateTargetsData(msg.data);
      else if (msg.type === "telemetry_point") {
        telemetryPoints.push(msg.data);
        telemetryPoints = telemetryPoints.slice(-500);
        if (document.getElementById("telemetry-drawer").classList.contains("active")) {
          drawTelemetryChart();
        }
      } else if (msg.type === "busy") updateBusyState(msg.data);
    } catch (e) {}
  };

  ws.onclose = () => {
    if (!selectedSessionId) {
      statusPill.innerHTML = '<span class="status-dot" style="background:var(--amber);"></span> Reconnecting...';
      statusPill.style.color = 'var(--amber)';
    }
    setTimeout(connectWebSocket, 2000);
  };

  ws.onerror = () => {
    ws.close();
  };
}

// Start WebSocket Live Stream & Session List
connectWebSocket();
loadConversationsList();
setInterval(loadConversationsList, 15000);
</script>
